    <meta property="og:image" content="https://media.base44.com/images/public/6a252a130a6d44cc87309d9e/901f2c158_generated_image.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;600;700&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Immediate theme bootstrap to prevent flash of wrong theme -->
    <script>
      (function () {
        var key = 'afrookoo-theme';
        var stored = localStorage.getItem(key);
        var theme = stored === 'light' || stored === 'dark'
          ? stored
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.classList.remove('light', 'dark');
        document.documentElement.classList.add(theme);
      })();
    </script>
  </head>
  <body class="bg-[var(--bg-page)] text-[var(--text-body)] antialiased selection:bg-blue-600 selection:text-white transition-colors duration-300">
    <div id="root"></div>

  </body>
